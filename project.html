<script>
(async()=>{
 const {$,esc}=AV; AV.clock(); $("#yr").textContent=new Date().getFullYear(); document.body.classList.add("ready");
 const slug=location.pathname.split("/").pop();
 const r=await fetch("/api/project/"+encodeURIComponent(slug)); const d=await r.json().catch(()=>({}));
 if(!r.ok){ $("#t").textContent="Not found"; $("#player").remove(); AV.nav({}); return; }
 const p=d.project; document.title=p.title+" · AVERON";
 const metaDescription=document.querySelector('meta[name="description"]'); if(metaDescription) metaDescription.content=(p.tagline||p.description||"Explore a website project by AVERON.").slice(0,155);
 const ogTitle=document.querySelector('meta[property="og:title"]'); if(ogTitle) ogTitle.content=p.title+" · AVERON";
 const ogDescription=document.querySelector('meta[property="og:description"]'); if(ogDescription) ogDescription.content=(p.tagline||p.description||"Explore a website project by AVERON.").slice(0,155);
 const ogImage=document.querySelector('meta[property="og:image"]'); if(ogImage&&p.poster) ogImage.content=new URL(p.poster,location.href).href;
 $("#t").textContent=p.title; $("#tag").textContent=p.tagline||""; $("#desc").textContent=p.description||"";
 const v=p.video;
 const shotU=p.link?"https://s.wordpress.com/mshots/v1/"+encodeURIComponent(/^https?:/.test(p.link)?p.link:"https://"+p.link)+"?w=1600&h=1000":"";
 $("#player").innerHTML= !v ? (p.poster?'<img src="'+esc(p.poster)+'" alt="">':shotU?'<img src="'+esc(shotU)+'" alt="" onerror="this.outerHTML=\'<div class=ph>'+esc(p.title.charAt(0))+'</div>\'">':'<div class="ph">'+esc(p.title.charAt(0))+'</div>')
  : v.kind==="iframe" ? '<iframe src="'+esc(v.src)+'" allow="accelerometer;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading="lazy" title="'+esc(p.title)+' video"></iframe>'
  : '<video controls playsinline preload="metadata" '+(p.poster?'poster="'+esc(p.poster)+'" ':'')+'src="'+esc(v.src)+'#t=0.1"></video>';
 const host=(()=>{try{return new URL(p.link).host.replace(/^www\./,"")}catch{return ""}})();
 $("#addr").innerHTML=p.link?'<a href="'+esc(p.link)+'" target="_blank" rel="noopener">'+esc(host||p.link)+' ↗</a>':esc(p.title);
 $("#topacts").innerHTML=p.link?'<a class="btn main live" href="'+esc(p.link)+'" target="_blank" rel="noopener">Visit live website <b>↗</b></a>':'';
 $("#acts").innerHTML=(p.link?'<a class="btn main" href="'+esc(p.link)+'" target="_blank" rel="noopener">Visit live website</a>':'')+'<a class="btn wa" data-wa="Hello AVERON, I saw your project '+esc(p.title)+' and I want something like it." href="#">I want something like this</a>';
 $("#facts").innerHTML=[["Type",p.category],["Year",p.year],["Built by",d.settings.ownerName]].filter(x=>x[1]).map(x=>'<div><small>'+x[0]+'</small><b>'+esc(x[1])+'</b></div>').join("")+(p.link?'<div><small>Live site</small><b><a href="'+esc(p.link)+'" target="_blank" rel="noopener" style="color:var(--g)">'+esc(host)+' ↗</a></b></div>':"");
 const n=d.others[0]; if(n){ $("#next").hidden=false; $("#next").href="/project/"+n.slug; $("#nt").textContent=n.title; }
 AV.nav(d.settings); AV.scrollUI();
})();
</script></body></html>
